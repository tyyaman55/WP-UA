name: Wikipedia Bot to Bluesky

on:
  schedule:
    # TSİ 9 = UTC 6
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılıkları Yükle
        run: |
          pip install atproto requests pillow

      - name: Botu Çalıştır
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python wiki_bot.py

      - name: Hafızayı Kaydet
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add posted_articles.txt
          if ! git diff --staged --quiet; then
            git commit -m "chore: update posted wiki archive [skip ci]"
            for i in {1..3}; do
              git pull --rebase origin main && git push origin main && break
              sleep 2
            done
          fi
