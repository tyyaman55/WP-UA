name: Wikipedia Bot to Bluesky

on:
  schedule:
    - cron: '7 10 * * *'
  workflow_dispatch:

concurrency:
  group: wiki-sync
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılıkları Yükle
        run: |
          pip install atproto requests pillow tweepy

      - name: Botu Çalıştır
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          BSKY_TR_HANDLE: ${{ secrets.BSKY_TR_HANDLE }}
          BSKY_TR_APP_PASSWORD: ${{ secrets.BSKY_TR_APP_PASSWORD }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN_EN: ${{ secrets.X_ACCESS_TOKEN_EN }}
          X_ACCESS_SECRET_EN: ${{ secrets.X_ACCESS_SECRET_EN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python wiki_bot.py
