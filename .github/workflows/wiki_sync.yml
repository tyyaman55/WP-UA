name: Wikipedia Bot to Bluesky

on:
  schedule:
    - cron: '6 6 * * *'
  workflow_dispatch:

concurrency:
  group: wiki-sync
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılıkları Yükle
        run: |
          pip install atproto requests pillow

      - name: Botu Çalıştır
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          BSKY_TR_HANDLE: ${{ secrets.BSKY_TR_HANDLE }}
          BSKY_TR_APP_PASSWORD: ${{ secrets.BSKY_TR_APP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python wiki_bot.py

      - name: Hata Bildirimi (Otomatik Issue Aç)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          ERROR_DETAILS="İş akışı adımı beklenmedik şekilde kesintiye uğradı."
          if [ -f error_summary.txt ]; then
            ERROR_DETAILS=$(cat error_summary.txt)
          fi

          gh issue create \
            --title "🚨 Wikipedia Bot Çalışma Hatası ($(date +'%Y-%m-%d %H:%M UTC'))" \
            --body "### ⚠️ Bot Çalıştırma Hatası

          Bot çalıştırma adımı başarısız oldu ve paylaşım yapılamadı.

          **Arıza Nedeni:**
          \`\`\`
          ${ERROR_DETAILS}
          \`\`\`

          **İş Akışı Kayıtları:**
          Ayrıntılı hata loglarını incelemek için [buraya tıklayın](${RUN_URL})." || true
