name: Wikipedia Bot to Bluesky

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılıkları Yükle
        run: |
          pip install atproto requests pillow

      - name: Botu Çalıştır
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python wiki_bot.py

      - name: Hafızayı Kaydet (Akıllı Çakışma Çözücü)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update posted wiki archive [skip ci]"
          file_pattern: posted_articles.txt
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
